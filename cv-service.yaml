apiVersion: v1
kind: Service
metadata:
  name: cv-service
  labels:
    app: cv
spec:
  type: NodePort
  selector:
    app: cv
  ports:
    - name: http
      protocol: TCP
      port: 8005      # Port du Service dans le cluster
      targetPort: 80  # Port exposé par le conteneur nginx
      nodePort: 30001  # Port accessible sur chaque nœud